<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bike Parking Prediction</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="container">
        <h1>🚲 Bike Parking Occupancy Prediction</h1>

        <p>
            This system predicts the occupancy of bike parking spaces based on 
            real-time weather conditions and time automatically.
        </p>

        <hr>

        <h3>🚀 Automatic Prediction</h3>

        <form method="POST" action="/prediction" class="input-group">

            <label for="lugar">📍 Location</label>
            <input type="text" name="lugar" id="lugar" placeholder="Ej: Bogota" required>
            <small class="input-hint">Enter the location (example: Bogota).</small>

            <br><br>

            <label for="zona">🗺️ Zone</label>
            <select name="zona" id="zona" required>
                <option value="1">North</option>
                <option value="2">Center</option>
                <option value="3">South</option>
                <option value="4">Other</option>
            </select>
            <small class="input-hint">Select the zone of the city.</small>

            <br><br>

            <button type="submit" class="btn btn-primary">
                🔥 Predict Occupancy

        </form>

        <hr>

        {% if pred %}
            <div class="result-box">
                <h3>📊 Prediction Result</h3>
                <p><strong>{{ pred }}</strong> bicycles (estimated occupancy)</p>
            </div>
        {% endif %}

    </div>

</body>
</html>
