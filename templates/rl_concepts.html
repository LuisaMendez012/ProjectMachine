<h1>Reinforcement Learning Concepts</h1>

<p>Reinforcement Learning is a learning method where an agent interacts with an environment.</p>

<ul>
<li>Agent: decision maker</li>
<li>Environment: system</li>
<li>States: situations</li>
<li>Actions: decisions</li>
<li>Rewards: feedback</li>
<li>Policy: strategy</li>
<li>Exploration vs Exploitation</li>
</ul>
